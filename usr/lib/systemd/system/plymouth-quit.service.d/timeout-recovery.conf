[Service]
# A timed-out quit client leaves plymouthd holding DRM master. ExecStopPost
# participates in ordering, so the display manager waits for this cleanup.
# Signal the boot service's main process; do not enqueue a stop job here,
# which would conflict with the ordering on plymouth-start.service.
TimeoutStopSec=5s
TimeoutStopFailureMode=kill
ExecStopPost=-/usr/bin/sh -c 'if [ "$$SERVICE_RESULT" = timeout ]; then echo "Plymouth quit timed out; terminating the boot splash daemon" >&2; exec /usr/bin/systemctl kill --kill-whom=main --signal=SIGKILL --wait plymouth-start.service; fi'
